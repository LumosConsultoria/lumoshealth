services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: lumoshealth
      POSTGRES_USER: lumos
      POSTGRES_PASSWORD: lumos
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumos -d lumoshealth"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"

  api:
    build: ./server
    env_file: ./server/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "4000:4000"

volumes:
  postgres_data:
  redis_data:
